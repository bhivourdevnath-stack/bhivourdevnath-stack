name: Pacman Contribution Graph

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:  # Manual trigger

jobs:
  pacman-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install github-contribution-graph-as-pacman-animation --save-dev

      - name: Generate Pac-Man contribution graph
        run: |
          npx github-contribution-graph-as-pacman-animation \
            --username ${{ github.repository_owner }} \
            --output-dir ./graph-output \
            --game galaga

      - name: Checkout pacman-output branch
        uses: actions/checkout@v4
        with:
          ref: pacman-output
          path: pacman-output-branch

      - name: Copy generated files
        run: |
          cp ./graph-output/galaga-contribution-graph.svg ./pacman-output-branch/
          cp ./graph-output/galaga-contribution-graph-dark.svg ./pacman-output-branch/

      - name: Commit and push changes
        working-directory: ./pacman-output-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Pac-Man contribution graph" || echo "No changes to commit"
          git push
